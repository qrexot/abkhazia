<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1211" id="themeColorMeta">
<title>Штаб Абхазии — Оперативно-стратегическая карта</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>
(function(){
  try {
    var saved = localStorage.getItem('abkhazia_atlas_theme');
    var dark = saved ? saved === 'dark' : true;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.getElementById('themeColorMeta');
    if (m) m.setAttribute('content', dark ? '#0d1211' : '#f4f3ec');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=motion-1">
</head>
<body class="war-mode">
<header>
  <a class="identity" href="#map" id="brandHome" aria-label="Штаб Абхазии, общий вид">
    <img src="assets/mark.svg" alt="">
    <span class="brandText">
      <strong>Штаб Абхазии</strong>
      <small>Оперативно-стратегический центр</small>
    </span>
  </a>

  <div class="headerActions">
    <button class="themeBtn onlineBtn" id="onlineToggle" type="button" aria-label="Онлайн-матч 1 на 1" title="Пригласить друга по ссылке (Supabase)">
      <span class="onlineDot" id="onlineDot" aria-hidden="true"></span>
      <span id="onlineLabel">Онлайн 1×1</span>
    </button>
    <button class="themeBtn" id="guideToggle" type="button" aria-label="Как играть и режим вдвоём" title="Инструкция и игра вдвоём · H">
      <span class="guideDot" aria-hidden="true">?</span>
      <span>Как играть</span>
    </button>
    <button class="themeBtn" id="themeToggle" type="button" aria-label="Переключить тему оформления" title="Сменить тему · T">
      <span class="themeIcon" id="themeIcon" data-icon="sun"></span>
      <span class="themeLabel" id="themeLabel">Светлая</span>
    </button>
  </div>
</header>

<main id="layout">
  <aside id="side" aria-label="Панель командования">
    <div id="warSideContent" class="sideSlot"></div>
  </aside>

  <section id="map" tabindex="0" aria-label="Тактическая карта Абхазии">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <canvas id="warCanvas" aria-hidden="true"></canvas>

    <div id="warHud" class="warHud"></div>
    <div id="warLensBar" class="warLensBar" hidden></div>
    <div id="warHoverTip" class="warHoverTip" hidden></div>
    <div id="eventOverlay" class="eventOverlay" hidden></div>
    <div id="victoryOverlay" class="eventOverlay" hidden></div>

    <div class="mapHeader">
      <button class="mapBtn iconOnly" id="sidebarToggle" data-action="side" type="button" aria-label="Свернуть или открыть панель" title="Боковая панель · B" data-icon="sidebar"></button>
      <button class="mapBtn iconOnly" id="layerButton" type="button" aria-expanded="false" aria-controls="layers" aria-label="Слои карты" title="Слои и рельеф карты">
        <span data-icon="layers"></span>
      </button>
    </div>

    <div id="layers" class="floating" hidden>
      <div class="panelTitleRow">
        <h3>Слои карты</h3>
        <span class="panelBadge">HD</span>
      </div>
      <div class="presetGroup" role="group" aria-label="Стиль карты">
        <button class="presetBtn active" type="button" data-preset="atlas">Рельеф</button>
        <button class="presetBtn" type="button" data-preset="topo">Топо</button>
        <button class="presetBtn" type="button" data-preset="scheme">Схема</button>
      </div>
      <div id="layerItems"></div>
    </div>

    <div class="mapTools">
      <button class="mapBtn iconOnly" id="home" type="button" aria-label="Показать всю Абхазию" title="Вся карта · Home" data-icon="fit"></button>
      <div class="zoom">
        <button class="mapBtn" id="zoomIn" type="button" aria-label="Приблизить" title="Приблизить · +" data-icon="plus"></button>
        <div class="zoomReadout" id="zoomLevel" title="Текущее увеличение">1.0×</div>
        <button class="mapBtn" id="zoomOut" type="button" aria-label="Отдалить" title="Отдалить · −" data-icon="minus"></button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div class="statusbar">
      <div class="statusLeft">
        <div class="scale">
          <span id="scaleText"></span>
          <b id="scaleLine"></b>
        </div>
        <span class="statusSep" aria-hidden="true"></span>
        <span id="zoomStatus" class="statusMono"></span>
      </div>
      <span id="position" class="statusMono"></span>
      <span class="statusMono statusBrand">Штаб Абхазии</span>
    </div>
  </section>
</main>

<dialog id="dialog">
  <div class="dialogHead">
    <h2 id="dialogTitle"></h2>
    <button class="iconButton" id="dialogClose" type="button" aria-label="Закрыть" data-icon="close"></button>
  </div>
  <div id="dialogBody"></div>
</dialog>
